<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên Hệ - SunPower Việt</title>
    <meta name="description" content="Liên hệ SunPower Việt để nhận tư vấn miễn phí về giải pháp điện mặt trời cho doanh nghiệp. Hotline, email, địa chỉ văn phòng đầy đủ.">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☀️</text></svg>">
</head>
<body>

    <div id="header-placeholder"></div>

    <section class="page-hero">
        <h1>Liên Hệ Với Chúng Tôi</h1>
        <p>Sẵn sàng tư vấn giải pháp điện mặt trời phù hợp cho doanh nghiệp của bạn</p>
    </section>

    <section class="contact-page">
        <div class="contact-page-grid">

            <div class="contact-info">
                <h2>Thông Tin Liên Hệ</h2>

                <div class="info-item">
                    <div class="info-icon">📍</div>
                    <div>
                        <strong>Địa chỉ văn phòng</strong>
                        <p>123 Đường Nguyễn Văn Linh, Quận 7, TP.HCM</p>
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-icon">📞</div>
                    <div>
                        <strong>Hotline</strong>
                        <p>1900 xxxx</p>
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-icon">✉️</div>
                    <div>
                        <strong>Email</strong>
                        <p>lienhe@sunpowerviet.vn</p>
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-icon">🕒</div>
                    <div>
                        <strong>Giờ làm việc</strong>
                        <p>Thứ 2 - Thứ 6: 8:00 - 17:30</p>
                    </div>
                </div>

                <div class="map-embed">
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3919.4972!2d106.7!3d10.73!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMTDCsDQzJzQ4LjAiTiAxMDbCsDQyJzAwLjAiRQ!5e0!3m2!1svi!2s!4v1"
                        width="100%"
                        height="250"
                        style="border:0;"
                        allowfullscreen=""
                        loading="lazy">
                    </iframe>
                </div>
            </div>

            <div class="contact-form-wrapper">
                <h2>Gửi Yêu Cầu Tư Vấn</h2>
                <form class="contact-form" id="contactForm" action="https://formspree.io/f/xljrgvzy" method="POST">
                    <input type="text" id="inputName" name="ho_ten" placeholder="Họ và tên" required>
                    <input type="email" id="inputEmail" name="email" placeholder="Email" required>
                    <input type="tel" id="inputPhone" name="so_dien_thoai" placeholder="Số điện thoại" required>
                    <textarea id="inputMessage" name="noi_dung" placeholder="Nội dung cần tư vấn" rows="5"></textarea>
                    <button type="submit">Gửi Yêu Cầu</button>
                    <p id="formError" style="color: red;"></p>
                </form>
            </div>

        </div>
    </section>

    <div id="footer-placeholder"></div>

    <script src="script.js"></script>
</body>
</html>
